spring:
  datasource:
    url: jdbc:h2:mem:shopdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      format_sql: true
      highlight_sql: true
      use_sql_comments: true
    defer-datasource-initialization: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
    com.sk.skala.shopapi: debug